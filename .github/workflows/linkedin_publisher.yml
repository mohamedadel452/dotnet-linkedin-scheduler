name: Automated LinkedIn Publisher (.NET Journey)

on:
  schedule:
    # Runs every Sunday, Tuesday, and Thursday at 18:00 UTC (8:00 PM Cairo Time)
    - cron: '0 18 * * 0,2,4'
  workflow_dispatch:
    inputs:
      day:
        description: 'Optional specific post number (leave empty for next pending post)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish Next Scheduled Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            python publish_to_linkedin.py --day "${{ github.event.inputs.day }}"
          else
            python publish_to_linkedin.py
          fi

      - name: Save updated queue state to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts_queue.json
          git diff --staged --quiet || (git commit -m "chore: mark LinkedIn post as published [skip ci]" && git push)
