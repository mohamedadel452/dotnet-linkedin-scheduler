name: Automated LinkedIn Publisher (.NET Journey)

on:
  schedule:
    # Checks every 30 minutes and publishes any post whose custom scheduled_at (Cairo Time) has arrived!
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Optional specific post number (leave empty for scheduled check)'
        required: false
        default: ''
      dry_run:
        description: 'Set to true to test without publishing to LinkedIn'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Schedule or Publish Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.day }}" ]; then
            python publish_to_linkedin.py --day "${{ github.event.inputs.day }}" $DRY_FLAG
          else
            python publish_to_linkedin.py --check-schedule $DRY_FLAG
          fi

      - name: Save updated queue state to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts_queue.json
          git diff --staged --quiet || (git commit -m "chore: mark LinkedIn post as published [skip ci]" && git push)
